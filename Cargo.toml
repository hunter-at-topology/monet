[package]
name = "monet"
version = "0.1.0"
edition = "2024"
description = "A shader REPL for making beautiful designs live: a chain language compiled to fused WGSL render graphs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hunter-at-topology/monet"
homepage = "https://monet.hunterharloff.com"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "persistence", "clipboard"] }
naga = { version = "30", features = ["wgsl-in"] }
png = "0.18.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Instant and SystemTime that also work in the browser (re-exports std natively)
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "HtmlAnchorElement", "Location", "History", "Navigator", "Gpu", "Blob", "BlobPropertyBag", "Url", "Storage", "console"] }
console_error_panic_hook = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1

# The browser build: everything for speed, then wasm-opt -O3 (see web/build.sh).
[profile.web]
inherits = "release"
lto = "fat"
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
# tests also translate every shader to GLSL ES 3.0, as WebGL2 in the browser does
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }
