<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>monet</title>
  <meta name="description" content="A live-coding shader REPL for making beautiful designs. Type a chain, see light. Rust compiled to WebAssembly, drawing with WebGPU.">
  <meta name="theme-color" content="#fbf9f5">
  <link rel="icon" type="image/png" href="icon.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://monet.hunterharloff.com/">
  <meta property="og:title" content="monet">
  <meta property="og:description" content="Live-code beautiful designs. Rust, compiled to WebAssembly, on WebGPU.">
  <meta property="og:image" content="https://monet.hunterharloff.com/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="monet">
  <meta name="twitter:description" content="Live-code beautiful designs. Rust, compiled to WebAssembly, on WebGPU.">
  <meta name="twitter:image" content="https://monet.hunterharloff.com/og.jpg">
  <link rel="modulepreload" href="monet.js">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fbf9f5; }
    /* eframe sizes the canvas to its CSS box */
    #monet { position: fixed; left: 0; top: 0; width: 100%; height: 100%; outline: none; }
    #status {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 32px; box-sizing: border-box; text-align: center; pointer-events: none;
      font: 15px/1.5 ui-monospace, "SF Mono", Menlo, monospace; color: #8e887d;
      opacity: 0; transition: opacity .3s;
    }
    #status.shown { opacity: 1; }
    #status b { color: #2a2926; font-weight: 400; }
  </style>
</head>
<body>
  <canvas id="monet"></canvas>
  <div id="status" class="shown"><span><b>monet</b> · warming up the GPU…</span></div>
  <noscript><p style="font-family: monospace; padding: 32px">monet needs JavaScript and WebAssembly.</p></noscript>
  <script>
    // Phones: the keyboard and in-app browser toolbars (X, Instagram…) cover the
    // bottom of the page without resizing it. Size the canvas to what's visible.
    (() => {
      const vv = window.visualViewport;
      if (!vv) return;
      const fit = () => {
        const c = document.getElementById("monet");
        if (!c) return;
        c.style.height = vv.height + "px";
        c.style.top = vv.offsetTop + "px";
      };
      vv.addEventListener("resize", fit);
      // egui types through a hidden <input>: phone keyboards must not autocorrect,
      // predict or capitalise code (it holds characters back and eats some)
      new MutationObserver(() => {
        for (const i of document.querySelectorAll("input:not([data-code])")) {
          i.dataset.code = "1";
          i.setAttribute("autocorrect", "off");
          i.setAttribute("autocomplete", "off");
          i.setAttribute("autocapitalize", "off");
          i.setAttribute("spellcheck", "false");
          i.setAttribute("enterkeyhint", "enter");
        }
      }).observe(document.body, { childList: true, subtree: true });
      vv.addEventListener("scroll", fit);
      addEventListener("load", fit);
      fit();
    })();
  </script>
  <script type="module">
    import init from "./monet.js";
    init().catch((e) => {
      // `start` reports its own errors; this is for the module failing to load at all
      if (String(e).includes("Using exceptions for control flow")) return;
      const s = document.getElementById("status");
      s.textContent = "monet couldn't load: " + e;
      s.className = "shown";
    });
  </script>
</body>
</html>
